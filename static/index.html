<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Event Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@500;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g1:#4ade80;--g2:#16a34a;--g3:#052e16;--g4:#14532d;--bg:#050f07;--bg2:#0a160b;--bg3:#0f1e10;--border:#1a3a1e;--text:#c6dfc9;--muted:#5a856a;--white:#eef5ee;--red:#ef4444;--amber:#f59e0b;--purple:#a78bfa;--mono:'Share Tech Mono',monospace;--sans:'Barlow',sans-serif;--head:'Oswald',sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(74,222,128,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(74,222,128,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.topbar{position:sticky;top:0;z-index:100;background:rgba(5,15,7,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;height:52px;gap:12px}
.topbar-brand{font-family:var(--head);font-size:1rem;font-weight:700;color:var(--g1);letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}
.topbar-nav{display:flex;gap:3px;margin-left:20px;flex-wrap:wrap}
.topbar-nav button{background:none;border:1px solid transparent;color:var(--muted);font-family:var(--mono);font-size:.68rem;letter-spacing:.07em;padding:6px 12px;border-radius:3px;cursor:pointer;transition:all .15s;white-space:nowrap}
.topbar-nav button:hover,.topbar-nav button.active{color:var(--g1);border-color:rgba(74,222,128,.25);background:rgba(74,222,128,.06)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.topbar-user{font-family:var(--mono);font-size:.65rem;color:var(--muted);letter-spacing:.05em}
.topbar-user b{color:var(--g1)}
.btn-logout{background:none;border:1px solid rgba(239,68,68,.3);color:var(--red);font-family:var(--mono);font-size:.62rem;padding:5px 10px;border-radius:3px;cursor:pointer;transition:all .15s}
.btn-logout:hover{background:rgba(239,68,68,.1);border-color:var(--red)}
main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:32px 28px 80px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:44px 40px;width:100%;max-width:380px;text-align:center}
.login-box h2{font-family:var(--head);font-size:1.4rem;color:var(--white);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.login-box .sub{font-family:var(--mono);font-size:.62rem;color:var(--muted);letter-spacing:.12em;margin-bottom:28px}
.login-box input{display:block;width:100%;background:var(--bg);border:1px solid var(--border);color:var(--white);font-family:var(--sans);font-size:.9rem;padding:11px 14px;border-radius:4px;margin-bottom:12px;outline:none;transition:border-color .15s}
.login-box input:focus{border-color:var(--g2)}
.login-box .btn-login{width:100%;padding:12px;background:var(--g2);color:#fff;font-family:var(--head);font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;border:none;border-radius:4px;cursor:pointer;transition:background .15s}
.login-box .btn-login:hover{background:var(--g1);color:var(--bg)}
.login-err{color:var(--red);font-size:.82rem;margin-top:12px;min-height:20px}
.cards{display:grid;gap:12px}
.card{background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--g4);border-radius:0 6px 6px 0;padding:18px 22px;cursor:pointer;transition:all .2s;color:inherit;position:relative}
.card:hover{background:var(--bg3)}
.card.st-approved{border-left-color:#16a34a;background:rgba(22,163,74,.04)}
.card.st-approved:hover{background:rgba(22,163,74,.08)}
.card.st-rejected{border-left-color:#dc2626;background:rgba(220,38,38,.04)}
.card.st-rejected:hover{background:rgba(220,38,38,.08)}
.card.st-pending{border-left-color:#a16207}
.card-top{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-bottom:6px}
.card-num{font-family:var(--mono);font-size:1rem;color:var(--g1);font-weight:700}
.card-title{font-family:var(--head);font-size:1rem;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:.04em}
.card-pills{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;align-items:center}
.pill{font-family:var(--mono);font-size:.55rem;letter-spacing:.07em;color:var(--g1);background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.2);border-radius:99px;padding:2px 9px;white-space:nowrap}
.sb{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;padding:3px 10px;border-radius:3px;font-weight:700}
.sb.approved{color:#22c55e;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3)}
.sb.rejected{color:#ef4444;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)}
.sb.pending{color:#eab308;background:rgba(234,179,8,.08);border:1px solid rgba(234,179,8,.2)}
.card-desc{font-size:.88rem;color:var(--text);line-height:1.65;margin-bottom:4px}
.card-meta{font-family:var(--mono);font-size:.58rem;color:var(--muted);letter-spacing:.06em}
.ev-hero{padding:28px 0 20px;border-bottom:1px solid var(--border);margin-bottom:24px}
.ev-hero h1{font-family:var(--head);font-size:clamp(1.5rem,4vw,2.2rem);color:var(--white);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ev-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ev-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:24px}
.ev-info-cell{background:var(--bg2);padding:12px 14px}
.ev-info-cell .lbl{font-family:var(--mono);font-size:.52rem;letter-spacing:.2em;color:var(--g1);text-transform:uppercase;margin-bottom:3px}
.ev-info-cell .val{font-size:.88rem;color:var(--white)}
.ev-section{margin-bottom:24px}
.ev-section-title{font-family:var(--head);font-size:.85rem;font-weight:700;color:var(--g1);text-transform:uppercase;letter-spacing:.12em;padding-bottom:7px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.ev-body{font-size:.92rem;line-height:1.75;color:var(--text)}
.ev-body h3{font-family:var(--head);font-size:.82rem;color:var(--g1);text-transform:uppercase;margin:14px 0 6px}
.ev-body p{margin-bottom:8px}
.ev-body b,.ev-body strong{color:var(--g1);font-weight:500}
.ev-note{background:rgba(74,222,128,.04);border:1px solid rgba(74,222,128,.18);border-radius:4px;padding:11px 15px;margin:12px 0;font-size:.85rem;color:#86c997;line-height:1.65;white-space:pre-line}
.btn-back{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.68rem;color:var(--muted);background:none;border:1px solid var(--border);padding:5px 12px;border-radius:3px;cursor:pointer;margin-bottom:16px;transition:all .15s}
.btn-back:hover{color:var(--g1);border-color:rgba(74,222,128,.3)}
.ev-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{font-family:var(--mono);font-size:.68rem;letter-spacing:.07em;padding:8px 16px;border-radius:4px;cursor:pointer;border:1px solid;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-green{background:var(--g2);color:#fff;border-color:var(--g2)}.btn-green:hover{background:var(--g1);color:var(--bg)}
.btn-outline{background:none;color:var(--muted);border-color:var(--border)}.btn-outline:hover{color:var(--g1);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.04)}
.btn-red{background:none;color:var(--red);border-color:rgba(239,68,68,.3)}.btn-red:hover{background:rgba(239,68,68,.1)}
.btn-approve{background:rgba(34,197,94,.15);color:#22c55e;border-color:rgba(34,197,94,.4)}.btn-approve:hover{background:rgba(34,197,94,.25)}
.btn-reject{background:rgba(239,68,68,.1);color:#ef4444;border-color:rgba(239,68,68,.3)}.btn-reject:hover{background:rgba(239,68,68,.18)}
.fg{margin-bottom:14px}.fg label{display:block;font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;color:var(--g1);text-transform:uppercase;margin-bottom:5px}
.fg input,.fg textarea,.fg select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--white);font-family:var(--sans);font-size:.88rem;padding:10px 12px;border-radius:4px;outline:none;transition:border-color .15s}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--g2)}
.fg textarea{min-height:110px;resize:vertical;line-height:1.6}.fg select{cursor:pointer}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ucard{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px 18px;margin-bottom:10px}
.ucard-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.ucard-name{font-size:.92rem;color:var(--white);font-weight:500}
.ucard-login{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.ucard-id{font-family:var(--mono);font-size:.72rem;color:var(--g1)}
.ucard-ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.rbadge{font-family:var(--mono);font-size:.54rem;letter-spacing:.06em;padding:3px 8px;border-radius:3px;display:inline-block;border:1px solid}
.tsel{background:var(--bg);border:1px solid var(--border);color:var(--white);font-family:var(--mono);font-size:.62rem;padding:4px 6px;border-radius:3px;cursor:pointer;outline:none}
.tsel:focus{border-color:var(--g2)}
.tbtn{font-family:var(--mono);font-size:.58rem;padding:3px 8px;border-radius:3px;cursor:pointer;border:1px solid;transition:all .15s;background:none}
/* spawn */
.spawn-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:10px 14px;margin-bottom:6px}
.spawn-item .si-name{font-size:.9rem;color:var(--white)}.spawn-item .si-cat{font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-left:8px}
.spawn-item .si-qty{font-family:var(--mono);font-size:.82rem;color:var(--g1);margin-left:auto;margin-right:12px}
.spawn-report-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:10px 14px;margin-bottom:6px;flex-wrap:wrap}
.sr-item{font-size:.88rem;color:var(--white);font-weight:500}.sr-qty{font-family:var(--mono);font-size:.82rem;color:var(--g1)}.sr-user{font-family:var(--mono);font-size:.6rem;color:var(--muted)}.sr-note{font-size:.78rem;color:var(--muted);font-style:italic}
/* role card */
.role-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:14px 18px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.role-card .rc-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.role-card .rc-name{font-family:var(--head);font-size:.9rem;color:var(--white);text-transform:uppercase}
.role-card .rc-key{font-family:var(--mono);font-size:.6rem;color:var(--muted)}
.role-card .rc-perms{font-family:var(--mono);font-size:.55rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.role-card .rc-perm{padding:2px 6px;border-radius:2px}
.rc-perm.on{color:var(--g1);background:rgba(74,222,128,.08)}.rc-perm.off{color:#555;background:rgba(255,255,255,.02)}

.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--g2);border-radius:6px;padding:12px 20px;font-family:var(--mono);font-size:.76rem;color:var(--g1);z-index:9999;transform:translateY(100px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}.toast.error{border-color:var(--red);color:var(--red)}
.page-title{font-family:var(--head);font-size:1.2rem;color:var(--white);text-transform:uppercase;letter-spacing:.06em;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.page-title .count{font-family:var(--mono);font-size:.65rem;color:var(--muted)}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}.empty-state .big{font-size:2.5rem;margin-bottom:10px}
footer{position:relative;z-index:1;text-align:center;padding:18px;font-family:var(--mono);font-size:.58rem;color:var(--muted);letter-spacing:.1em;border-top:1px solid var(--border);margin-top:50px}
@media(max-width:580px){.topbar{padding:8px 12px;height:auto;flex-wrap:wrap} main{padding:20px 12px 60px} .fr{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar" id="topbar" style="display:none">
  <span class="topbar-brand">Event Hub</span>
  <div class="topbar-nav">
    <button onclick="SP('events')" id="nav-events">Ивенты</button>
    <button onclick="SP('my')" id="nav-my">Мои</button>
    <button onclick="SP('create')" id="nav-create">Создать</button>
    <button onclick="SP('spawn')" id="nav-spawn">Спавн-лист</button>
    <button onclick="SP('users')" id="nav-users" style="display:none">Юзеры</button>
    <button onclick="SP('roles')" id="nav-roles" style="display:none">Роли</button>
  </div>
  <div class="topbar-right">
    <span class="topbar-user" id="topbar-user"></span>
    <button class="btn-logout" onclick="logout()">Выход</button>
  </div>
</div>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
let U=null, ROLES=[];
const SL={approved:{i:'✅',t:'Одобрен',c:'approved'},rejected:{i:'❌',t:'Отклонён',c:'rejected'},pending:{i:'⏳',t:'На проверке',c:'pending'}};
function stb(s){const o=SL[s]||SL.pending;return`<span class="sb ${o.c}">${o.i} ${o.t}</span>`}
function esc(s){if(s==null)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function escTA(s){return(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toast(m,e){const t=$('toast');t.textContent=m;t.className='toast show'+(e?' error':'');setTimeout(()=>t.className='toast',3000)}
function $(id){return document.getElementById(id)}
function roleBadge(rk){const r=ROLES.find(x=>x.role_key===rk);if(!r)return`<span class="rbadge" style="color:var(--muted);border-color:var(--border)">${esc(rk)}</span>`;return`<span class="rbadge" style="color:${r.color};border-color:${r.color}40;background:${r.color}15">${esc(r.display_name)}</span>`}
function roleLabel(rk){const r=ROLES.find(x=>x.role_key===rk);return r?r.display_name:rk}

async function init(){ROLES=await(await fetch('/api/roles')).json();const d=await(await fetch('/api/me')).json();if(d.authenticated){U=d;onLogin()}else showLogin()}
function onLogin(){
  $('topbar').style.display='flex';
  $('topbar-user').innerHTML=`<b>${U.display_name}</b> · ${U.role_display}`;
  $('nav-users').style.display=U.can_manage_users?'':'none';
  $('nav-roles').style.display=U.can_manage_roles?'':'none';
  SP('events');
}
function showLogin(){
  $('topbar').style.display='none';
  $('app').innerHTML=`<div class="login-wrap"><div class="login-box"><h2>Event Hub</h2><p class="sub">Панель управления ивентами</p><input type="text" id="l-u" placeholder="Логин" autocomplete="username"><input type="password" id="l-p" placeholder="Пароль" autocomplete="current-password"><button class="btn-login" onclick="doLogin()">Войти</button><div class="login-err" id="l-e"></div></div></div>`;
  $('l-u').focus();$('l-p').onkeypress=e=>{if(e.key==='Enter')doLogin()};
}
async function doLogin(){
  const u=$('l-u').value.trim(),p=$('l-p').value;if(!u||!p)return;
  const fd=new FormData();fd.append('username',u);fd.append('password',p);
  const d=await(await fetch('/api/login',{method:'POST',body:fd})).json();
  if(d.error){$('l-e').textContent=d.error;return}
  ROLES=await(await fetch('/api/roles')).json();
  U=await(await fetch('/api/me')).json();onLogin();
}
async function logout(){await fetch('/api/logout',{method:'POST'});U=null;showLogin()}

function SP(p){
  document.querySelectorAll('.topbar-nav button').forEach(b=>b.classList.remove('active'));
  const n=$('nav-'+p);if(n)n.classList.add('active');
  if(p==='events')loadEvents();else if(p==='my')loadMyEvents();else if(p==='create')showEventForm();
  else if(p==='spawn')loadSpawnList();else if(p==='users')loadUsers();else if(p==='roles')loadRoles();
}

// ══ EVENTS ══
function renderCards(evs,title,empty){
  if(!evs.length){$('app').innerHTML=`<div class="page-title">${title}</div><div class="empty-state"><div class="big">📭</div><p>${empty}</p></div>`;return}
  let h=`<div class="page-title">${title} <span class="count">(${evs.length})</span></div><div class="cards">`;
  evs.forEach((ev,i)=>{const st=ev.status||'pending';
    h+=`<div class="card st-${st}" onclick="viewEvent(${ev.id})">
      <div class="card-top"><span class="card-num">№${evs.length-i}</span><span class="card-title">${esc(ev.title)}</span>
      <div class="card-pills">${stb(st)}<span class="pill">${esc(ev.event_type)}</span><span class="pill">${esc(ev.duration)}</span></div></div>
      <div class="card-desc">${esc(ev.short_desc)}</div>
      <div class="card-meta">📍 ${esc(ev.location)} · 👤 ${esc(ev.organizer_name)} · ${esc(ev.author_name)}${ev.reviewed_by?' · ✓ '+esc(ev.reviewed_by):''}</div></div>`;
  });h+='</div>';$('app').innerHTML=h;
}
async function loadEvents(){renderCards(await(await fetch('/api/events')).json(),'Все ивенты','Ивенты не созданы.')}
async function loadMyEvents(){renderCards(await(await fetch('/api/events/my')).json(),'Мои ивенты','У вас нет ивентов.')}

async function viewEvent(id){
  const ev=await(await fetch('/api/events/'+id)).json();
  const st=ev.status||'pending';const isA=U&&U.id===ev.author_id;
  const isTop=U&&(U.role==='head_admin'||U.role==='admin');
  const canEdit=U&&(isTop||(st!=='approved'&&(U.can_edit_all||isA)));
  let h=`<button class="btn-back" onclick="SP('events')">← Назад</button>
    <div class="ev-hero"><h1>${esc(ev.title)} ${stb(st)}</h1>
    <div class="ev-pills"><span class="pill">${esc(ev.event_type)}</span><span class="pill">${esc(ev.duration)}</span></div></div>
    <div class="ev-info">
      <div class="ev-info-cell"><div class="lbl">Локация</div><div class="val">${esc(ev.location)}</div></div>
      <div class="ev-info-cell"><div class="lbl">Организатор</div><div class="val">${esc(ev.organizer_name)}</div></div>
      <div class="ev-info-cell"><div class="lbl">Автор</div><div class="val">${esc(ev.author_name)}</div></div>
      <div class="ev-info-cell"><div class="lbl">Статус</div><div class="val">${(SL[st]||SL.pending).t}${ev.reviewed_by?' ('+esc(ev.reviewed_by)+')':''}</div></div>
    </div>
    <div class="ev-section"><div class="ev-section-title">📡 Краткое описание</div><div class="ev-body"><p>${esc(ev.short_desc)}</p></div></div>
    <div class="ev-section"><div class="ev-section-title">📋 Полное описание</div><div class="ev-body">${ev.full_desc}</div></div>`;
  if(ev.rules_text)h+=`<div class="ev-section"><div class="ev-section-title">⚠ Правила</div><div class="ev-note">${esc(ev.rules_text)}</div></div>`;
  if(ev.rewards_text)h+=`<div class="ev-section"><div class="ev-section-title">🏆 Награды</div><div class="ev-note">${esc(ev.rewards_text)}</div></div>`;
  h+='<div class="ev-actions">';
  if(U&&U.can_approve){
    if(st!=='approved')h+=`<button class="btn btn-approve" onclick="reviewEv(${ev.id},'approve')">✅ Одобрить</button>`;
    if(st!=='rejected')h+=`<button class="btn btn-reject" onclick="reviewEv(${ev.id},'reject')">❌ Отклонить</button>`;
  }
  if(canEdit)h+=`<button class="btn btn-outline" onclick="editEvent(${ev.id})">✏ Редактировать</button>`;
  if(canEdit||isTop)h+=`<button class="btn btn-red" onclick="deleteEvent(${ev.id})">🗑 Удалить</button>`;
  if(st==='approved'&&!isTop&&isA)h+=`<span style="font-family:var(--mono);font-size:.65rem;color:var(--muted);margin-left:8px">🔒 Одобрен — редактирование заблокировано</span>`;
  h+='</div>';
  // Spawn report section
  h+=`<div class="ev-section" style="margin-top:32px"><div class="ev-section-title">📦 Отчёт о спавне</div><div id="spawn-rpt"></div></div>`;
  $('app').innerHTML=h;
  loadSpawnReports(ev.id, isA||U.can_edit_all||isTop);
}

async function loadSpawnReports(eid, canAdd){
  const reports=await(await fetch(`/api/events/${eid}/spawn-reports`)).json();
  const wl=await(await fetch('/api/spawn-whitelist')).json();
  let h='';
  if(reports.length){
    reports.forEach(r=>{
      const canDel=U&&(U.id===r.user_id||U.can_edit_all||U.role==='head_admin'||U.role==='admin');
      h+=`<div class="spawn-report-row">
        <span class="sr-item">${esc(r.item_name)}</span><span class="sr-qty">×${r.quantity}</span>
        <span class="sr-user">👤 ${esc(r.user_name)}</span>
        ${r.note?`<span class="sr-note">${esc(r.note)}</span>`:''}
        ${canDel?`<button class="tbtn" style="color:var(--red);border-color:rgba(239,68,68,.3);margin-left:auto" onclick="delSpawnRpt(${r.id},${eid})">✕</button>`:''}
      </div>`;
    });
  } else { h+=`<p style="color:var(--muted);font-size:.85rem">Отчётов пока нет</p>`; }
  if(canAdd){
    h+=`<form onsubmit="addSpawnRpt(event,${eid})" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:end">
      <div class="fg" style="margin:0;flex:2;min-width:150px"><label>Предмет</label>
        <select name="item_name" required style="padding:8px 10px"><option value="">Выберите...</option>`;
    wl.forEach(w=>{h+=`<option value="${esc(w.item_name)}">${esc(w.item_name)}${w.category?' ('+esc(w.category)+')':''}</option>`});
    h+=`<option value="__custom">Другой (ввести вручную)</option></select></div>
      <div class="fg" style="margin:0;width:70px"><label>Кол-во</label><input type="number" name="quantity" value="1" min="1" style="padding:8px 10px"></div>
      <div class="fg" style="margin:0;flex:1;min-width:100px"><label>Заметка</label><input name="note" placeholder="Необязательно" style="padding:8px 10px"></div>
      <button type="submit" class="btn btn-green" style="height:fit-content">➕</button></form>`;
  }
  $('spawn-rpt').innerHTML=h;
  // Handle custom item
  const sel=$('spawn-rpt').querySelector('select[name="item_name"]');
  if(sel)sel.onchange=function(){
    if(this.value==='__custom'){
      const inp=document.createElement('input');inp.name='item_name';inp.placeholder='Название предмета';inp.required=true;
      inp.style.cssText='width:100%;background:var(--bg);border:1px solid var(--border);color:var(--white);font-family:var(--sans);font-size:.88rem;padding:8px 10px;border-radius:4px;outline:none';
      this.replaceWith(inp);inp.focus();
    }
  };
}

async function addSpawnRpt(e,eid){e.preventDefault();const fd=new FormData(e.target);const d=await(await fetch(`/api/events/${eid}/spawn-reports`,{method:'POST',body:fd})).json();if(d.success){toast('Спавн записан!');loadSpawnReports(eid,true)}else toast(d.detail||'Ошибка',1)}
async function delSpawnRpt(rid,eid){const d=await(await fetch(`/api/spawn-reports/${rid}`,{method:'DELETE'})).json();if(d.success){toast('Удалено');loadSpawnReports(eid,true)}else toast(d.detail||'Ошибка',1)}
async function reviewEv(id,a){const d=await(await fetch(`/api/events/${id}/${a}`,{method:'POST'})).json();if(d.success){toast(a==='approve'?'Одобрен ✅':'Отклонён ❌');viewEvent(id)}else toast(d.detail||'Ошибка',1)}

function showEventForm(ev){
  const isE=!!ev;
  $('app').innerHTML=`<button class="btn-back" onclick="SP('events')">← Назад</button>
    <div class="page-title">${isE?'Редактирование':'Новый ивент'}</div>
    <form id="ef" onsubmit="saveEv(event,${isE?ev.id:0})">
      <div class="fr"><div class="fg"><label>Название</label><input name="title" value="${isE?esc(ev.title):''}" required></div>
      <div class="fg"><label>Тип</label><input name="event_type" value="${isE?esc(ev.event_type):''}" placeholder="Сюжетный / Поисковый" required></div></div>
      <div class="fr"><div class="fg"><label>Продолжительность</label><input name="duration" value="${isE?esc(ev.duration):''}" placeholder="2–3 часа" required></div>
      <div class="fg"><label>Локация</label><input name="location" value="${isE?esc(ev.location):''}" required></div></div>
      <div class="fg"><label>Организатор</label><input name="organizer_name" value="${isE?esc(ev.organizer_name):(U?U.display_name:'')}" required></div>
      <div class="fg"><label>Краткое описание</label><textarea name="short_desc" rows="3" required>${isE?esc(ev.short_desc):''}</textarea></div>
      <div class="fg"><label>Полное описание (HTML)</label><textarea name="full_desc" rows="10" required>${isE?escTA(ev.full_desc):''}</textarea></div>
      <div class="fg"><label>Правила</label><textarea name="rules_text" rows="3">${isE?esc(ev.rules_text||''):''}</textarea></div>
      <div class="fg"><label>Награды</label><textarea name="rewards_text" rows="3">${isE?esc(ev.rewards_text||''):''}</textarea></div>
      <div style="display:flex;gap:8px"><button type="submit" class="btn btn-green">${isE?'💾 Сохранить':'➕ Создать'}</button><button type="button" class="btn btn-outline" onclick="SP('events')">Отмена</button></div></form>`;
}
async function editEvent(id){showEventForm(await(await fetch('/api/events/'+id)).json());document.querySelectorAll('.topbar-nav button').forEach(b=>b.classList.remove('active'))}
async function saveEv(e,eid){e.preventDefault();const fd=new FormData($('ef'));const d=await(await fetch(eid?'/api/events/'+eid:'/api/events',{method:eid?'PUT':'POST',body:fd})).json();if(d.success){toast(eid?'Сохранено!':'Создан!');SP('events')}else toast(d.detail||'Ошибка',1)}
async function deleteEvent(id){if(!confirm('Удалить ивент?'))return;const d=await(await fetch('/api/events/'+id,{method:'DELETE'})).json();if(d.success){toast('Удалён');SP('events')}else toast(d.detail||'Ошибка',1)}

// ══ SPAWN WHITELIST ══
async function loadSpawnList(){
  const wl=await(await fetch('/api/spawn-whitelist')).json();
  const isAdmin=U&&(U.role==='head_admin'||U.role==='admin');
  let h=`<div class="page-title">📦 Разрешённые предметы для спавна <span class="count">(${wl.length})</span></div>`;
  if(isAdmin)h+=`<div id="swf" style="margin-bottom:16px"><button class="btn btn-green" onclick="showAddSpawn()">➕ Добавить предмет</button></div>`;
  if(!wl.length){h+=`<div class="empty-state"><div class="big">📦</div><p>Список пуст</p></div>`}
  else{
    let cats={};wl.forEach(w=>{const c=w.category||'Без категории';if(!cats[c])cats[c]=[];cats[c].push(w)});
    for(const[cat,items]of Object.entries(cats)){
      h+=`<div style="font-family:var(--mono);font-size:.65rem;color:var(--g1);letter-spacing:.1em;margin:16px 0 8px;text-transform:uppercase">${esc(cat)}</div>`;
      items.forEach(w=>{
        h+=`<div class="spawn-item"><span class="si-name">${esc(w.item_name)}</span>
          ${isAdmin?`<button class="tbtn" style="color:var(--red);border-color:rgba(239,68,68,.3)" onclick="delSpawnWL(${w.id})">✕</button>`:''}
        </div>`;
      });
    }
  }
  $('app').innerHTML=h;
}
function showAddSpawn(){
  $('swf').innerHTML=`<form onsubmit="addSpawnWL(event)" class="ucard" style="border-color:var(--g2)">
    <div class="fr"><div class="fg"><label>Название предмета</label><input name="item_name" required></div>
    <div class="fg"><label>Категория</label><input name="category" placeholder="Оружие, Медицина..."></div></div>
    <div style="display:flex;gap:8px"><button type="submit" class="btn btn-green">Добавить</button><button type="button" class="btn btn-outline" onclick="$('swf').innerHTML='<button class=btn\\ btn-green onclick=showAddSpawn()>➕ Добавить предмет</button>'">Отмена</button></div></form>`;
}
async function addSpawnWL(e){e.preventDefault();const d=await(await fetch('/api/spawn-whitelist',{method:'POST',body:new FormData(e.target)})).json();if(d.success){toast('Добавлено!');loadSpawnList()}else toast(d.detail||'Ошибка',1)}
async function delSpawnWL(id){if(!confirm('Удалить предмет из списка?'))return;const d=await(await fetch('/api/spawn-whitelist/'+id,{method:'DELETE'})).json();if(d.success){toast('Удалено');loadSpawnList()}else toast(d.detail||'Ошибка',1)}

// ══ USERS ══
async function loadUsers(){
  const r=await fetch('/api/users');if(r.status===403){toast('Нет прав',1);SP('events');return}
  const users=await r.json();
  let h=`<div class="page-title">Пользователи <span class="count">(${users.length})</span></div>
    <div style="margin-bottom:16px"><button class="btn btn-green" onclick="showAddUser()">➕ Добавить</button></div><div id="auf"></div>`;
  users.forEach((u,i)=>{
    const isSelf=u.id===U.id;
    h+=`<div class="ucard"><div class="ucard-head"><span class="ucard-id">#${i+1}</span><span class="ucard-name">${esc(u.display_name)}</span><span class="ucard-login">@${esc(u.username)}</span>${roleBadge(u.role)}</div>`;
    if(!isSelf){
      h+=`<div class="ucard-ctrls">
        <select class="tsel" onchange="changeRole(${u.id},this.value)">`;
      ROLES.forEach(r=>{h+=`<option value="${r.role_key}"${u.role===r.role_key?' selected':''}>${esc(r.display_name)}</option>`});
      h+=`</select>
        <button class="tbtn" style="color:var(--amber);border-color:rgba(245,158,11,.3)" onclick="showPerms(${u.id},${u.can_approve===null?'null':u.can_approve},${u.can_edit_all===null?'null':u.can_edit_all},${u.can_manage_users===null?'null':u.can_manage_users})">⚙ Права</button>
        <button class="tbtn" style="color:var(--purple);border-color:rgba(167,139,250,.3)" onclick="showPw(${u.id})">🔑</button>
        <button class="tbtn" style="color:var(--red);border-color:rgba(239,68,68,.3)" onclick="delUser(${u.id})">🗑</button></div>`;
    } else h+=`<div style="font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-top:4px">Это вы</div>`;
    h+=`<div id="p-${u.id}"></div><div id="pw-${u.id}"></div></div>`;
  });
  $('app').innerHTML=h;
}
function showAddUser(){
  let opts='';ROLES.forEach(r=>{opts+=`<option value="${r.role_key}"${r.role_key==='junior_eventologist'?' selected':''}>${esc(r.display_name)}</option>`});
  $('auf').innerHTML=`<div class="ucard" style="border-color:var(--g2)"><form onsubmit="addUser(event)">
    <div class="fr"><div class="fg"><label>Логин</label><input name="username" required></div><div class="fg"><label>Пароль</label><input type="password" name="password" required></div></div>
    <div class="fr"><div class="fg"><label>Имя</label><input name="display_name" required></div><div class="fg"><label>Роль</label><select name="role">${opts}</select></div></div>
    <div style="display:flex;gap:8px"><button type="submit" class="btn btn-green">Добавить</button><button type="button" class="btn btn-outline" onclick="$('auf').innerHTML=''">Отмена</button></div></form></div>`;
}
async function addUser(e){e.preventDefault();const d=await(await fetch('/api/users',{method:'POST',body:new FormData(e.target)})).json();if(d.success){toast('Добавлен!');loadUsers()}else toast(d.detail||'Ошибка',1)}
async function delUser(id){if(!confirm('Удалить?'))return;const d=await(await fetch('/api/users/'+id,{method:'DELETE'})).json();if(d.success){toast('Удалён');loadUsers()}else toast(d.detail||'Ошибка',1)}
async function changeRole(uid,role){const fd=new FormData();fd.append('role',role);const d=await(await fetch(`/api/users/${uid}/role`,{method:'PUT',body:fd})).json();if(d.success)toast('Роль изменена!');else toast(d.detail||'Ошибка',1)}
function showPerms(uid,ca,cea,cmu){
  const sel=(n,v)=>`<select class="tsel" name="${n}"><option value="null"${v===null?' selected':''}>По роли</option><option value="1"${v===1?' selected':''}>✅ Да</option><option value="0"${v===0?' selected':''}>❌ Нет</option></select>`;
  $('p-'+uid).innerHTML=`<form onsubmit="savePerms(event,${uid})" style="margin-top:10px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:4px">
    <div style="font-family:var(--mono);font-size:.58rem;color:var(--g1);margin-bottom:8px;letter-spacing:.1em">ИНДИВИДУАЛЬНЫЕ ПРАВА</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
      <span style="font-family:var(--mono);font-size:.58rem;color:var(--muted)">Одобрение: ${sel('can_approve',ca)}</span>
      <span style="font-family:var(--mono);font-size:.58rem;color:var(--muted)">Редакт.всех: ${sel('can_edit_all',cea)}</span>
      <span style="font-family:var(--mono);font-size:.58rem;color:var(--muted)">Упр.юзерами: ${sel('can_manage_users',cmu)}</span>
    </div>
    <div style="margin-top:10px;display:flex;gap:6px"><button type="submit" class="btn btn-green" style="font-size:.58rem;padding:5px 10px">Сохранить</button><button type="button" class="btn btn-outline" style="font-size:.58rem;padding:5px 10px" onclick="$('p-${uid}').innerHTML=''">Закрыть</button></div></form>`;
}
async function savePerms(e,uid){e.preventDefault();const d=await(await fetch(`/api/users/${uid}/perms`,{method:'PUT',body:new FormData(e.target)})).json();if(d.success){toast('Права сохранены!');loadUsers()}else toast(d.detail||'Ошибка',1)}
function showPw(uid){
  $('pw-'+uid).innerHTML=`<form onsubmit="chPw(event,${uid})" style="margin-top:8px;display:flex;gap:6px;align-items:end">
    <div class="fg" style="margin:0;flex:1"><label>Новый пароль</label><input type="password" name="password" required style="padding:6px 10px;font-size:.8rem"></div>
    <button type="submit" class="btn btn-green" style="font-size:.58rem;padding:6px 10px;height:fit-content">Сменить</button>
    <button type="button" class="btn btn-outline" style="font-size:.58rem;padding:6px 10px;height:fit-content" onclick="$('pw-${uid}').innerHTML=''">✕</button></form>`;
}
async function chPw(e,uid){e.preventDefault();const d=await(await fetch(`/api/users/${uid}/password`,{method:'PUT',body:new FormData(e.target)})).json();if(d.success){toast('Пароль изменён!');$('pw-'+uid).innerHTML=''}else toast(d.detail||'Ошибка',1)}

// ══ ROLES ══
async function loadRoles(){
  ROLES=await(await fetch('/api/roles')).json();
  let h=`<div class="page-title">⚙ Управление ролями <span class="count">(${ROLES.length})</span></div>
    <div style="margin-bottom:16px"><button class="btn btn-green" onclick="showAddRole()">➕ Новая роль</button></div><div id="arf"></div>`;
  ROLES.forEach(r=>{
    const pp=n=>r[n]?'on':'off';
    h+=`<div class="role-card">
      <div class="rc-dot" style="background:${r.color}"></div>
      <div><div class="rc-name">${esc(r.display_name)}</div><div class="rc-key">${esc(r.role_key)} · приоритет: ${r.priority}${r.is_system?' · системная':''}</div></div>
      <div class="rc-perms" style="margin-left:auto">
        <span class="rc-perm ${pp('can_approve')}">Одобрение</span>
        <span class="rc-perm ${pp('can_edit_all')}">Ред.всех</span>
        <span class="rc-perm ${pp('can_manage_users')}">Юзеры</span>
        <span class="rc-perm ${pp('can_manage_roles')}">Роли</span>
      </div>
      <div style="display:flex;gap:4px">
        <button class="tbtn" style="color:var(--amber);border-color:rgba(245,158,11,.3)" onclick="showEditRole(${r.id})">✏</button>
        ${!r.is_system?`<button class="tbtn" style="color:var(--red);border-color:rgba(239,68,68,.3)" onclick="delRole(${r.id})">🗑</button>`:''}
      </div>
    </div>`;
  });
  $('app').innerHTML=h;
}
function roleFormHTML(r){
  const isE=!!r;
  return`<div class="ucard" style="border-color:var(--g2)"><form onsubmit="${isE?`updRole(event,${r.id})`:'addRole(event)'}">
    <div class="fr"><div class="fg"><label>Ключ (англ.)</label><input name="role_key" value="${isE?esc(r.role_key):''}" ${isE?'readonly':''} required placeholder="my_custom_role"></div>
    <div class="fg"><label>Название</label><input name="display_name" value="${isE?esc(r.display_name):''}" required placeholder="Моя роль"></div></div>
    <div class="fr"><div class="fg"><label>Цвет (hex)</label><input name="color" type="color" value="${isE?r.color:'#4ade80'}"></div>
    <div class="fg"><label>Приоритет</label><input name="priority" type="number" value="${isE?r.priority:10}" min="1" max="100"></div></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin:12px 0">
      <label style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.65rem;color:var(--text);cursor:pointer"><input type="checkbox" name="can_approve" value="1" ${isE&&r.can_approve?'checked':''}> Одобрение</label>
      <label style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.65rem;color:var(--text);cursor:pointer"><input type="checkbox" name="can_edit_all" value="1" ${isE&&r.can_edit_all?'checked':''}> Редакт. всех</label>
      <label style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.65rem;color:var(--text);cursor:pointer"><input type="checkbox" name="can_manage_users" value="1" ${isE&&r.can_manage_users?'checked':''}> Управл. юзерами</label>
      <label style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.65rem;color:var(--text);cursor:pointer"><input type="checkbox" name="can_manage_roles" value="1" ${isE&&r.can_manage_roles?'checked':''}> Управл. ролями</label>
    </div>
    <div style="display:flex;gap:8px"><button type="submit" class="btn btn-green">${isE?'Сохранить':'Создать'}</button><button type="button" class="btn btn-outline" onclick="${isE?`$('erf-${r.id}').innerHTML=''`:`$('arf').innerHTML=''`}">Отмена</button></div></form></div>`;
}
function showAddRole(){$('arf').innerHTML=roleFormHTML()}
function showEditRole(id){
  const r=ROLES.find(x=>x.id===id);if(!r)return;
  // Create or reuse container
  let el=$('erf-'+id);
  if(!el){el=document.createElement('div');el.id='erf-'+id;r._cardEl=el;
    const cards=document.querySelectorAll('.role-card');cards.forEach(c=>{if(c.textContent.includes(r.display_name))c.after(el)});}
  el.innerHTML=roleFormHTML(r);
}
function buildRoleFD(form){
  const fd=new FormData();
  fd.append('role_key',form.role_key.value);fd.append('display_name',form.display_name.value);
  fd.append('color',form.color.value);fd.append('priority',form.priority.value);
  fd.append('can_approve',form.can_approve&&form.can_approve.checked?1:0);
  fd.append('can_edit_all',form.can_edit_all&&form.can_edit_all.checked?1:0);
  fd.append('can_manage_users',form.can_manage_users&&form.can_manage_users.checked?1:0);
  fd.append('can_manage_roles',form.can_manage_roles&&form.can_manage_roles.checked?1:0);
  return fd;
}
async function addRole(e){e.preventDefault();const d=await(await fetch('/api/roles',{method:'POST',body:buildRoleFD(e.target)})).json();if(d.success){toast('Роль создана!');loadRoles()}else toast(d.detail||'Ошибка',1)}
async function updRole(e,id){e.preventDefault();const d=await(await fetch('/api/roles/'+id,{method:'PUT',body:buildRoleFD(e.target)})).json();if(d.success){toast('Роль обновлена!');loadRoles()}else toast(d.detail||'Ошибка',1)}
async function delRole(id){if(!confirm('Удалить роль?'))return;const d=await(await fetch('/api/roles/'+id,{method:'DELETE'})).json();if(d.success){toast('Удалена');loadRoles()}else toast(d.detail||'Ошибка',1)}

init();
</script>
<footer>Event Hub · Панель управления ивентами</footer>
</body>
</html>
