<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Event Hub — Панель ивентов</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@500;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g1:#4ade80;--g2:#16a34a;--g3:#052e16;--g4:#14532d;--bg:#050f07;--bg2:#0a160b;--bg3:#0f1e10;--border:#1a3a1e;--text:#c6dfc9;--muted:#5a856a;--white:#eef5ee;--red:#ef4444;--amber:#f59e0b;--mono:'Share Tech Mono',monospace;--sans:'Barlow',sans-serif;--head:'Oswald',sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(74,222,128,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(74,222,128,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}

/* NAV */
.topbar{position:sticky;top:0;z-index:100;background:rgba(5,15,7,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;height:52px;gap:16px}
.topbar-brand{font-family:var(--head);font-size:1rem;font-weight:700;color:var(--g1);letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}
.topbar-nav{display:flex;gap:4px;margin-left:24px}
.topbar-nav button{background:none;border:1px solid transparent;color:var(--muted);font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;padding:6px 14px;border-radius:3px;cursor:pointer;transition:all .15s}
.topbar-nav button:hover,.topbar-nav button.active{color:var(--g1);border-color:rgba(74,222,128,.25);background:rgba(74,222,128,.06)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.topbar-user{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em}
.topbar-user b{color:var(--g1)}
.btn-logout{background:none;border:1px solid rgba(239,68,68,.3);color:var(--red);font-family:var(--mono);font-size:.65rem;padding:5px 12px;border-radius:3px;cursor:pointer;transition:all .15s}
.btn-logout:hover{background:rgba(239,68,68,.1);border-color:var(--red)}

/* MAIN */
main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:36px 32px 80px}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:44px 40px;width:100%;max-width:380px;text-align:center}
.login-box h2{font-family:var(--head);font-size:1.4rem;color:var(--white);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.login-box .sub{font-family:var(--mono);font-size:.65rem;color:var(--muted);letter-spacing:.12em;margin-bottom:28px}
.login-box input{display:block;width:100%;background:var(--bg);border:1px solid var(--border);color:var(--white);font-family:var(--sans);font-size:.9rem;padding:11px 14px;border-radius:4px;margin-bottom:12px;outline:none;transition:border-color .15s}
.login-box input:focus{border-color:var(--g2)}
.login-box .btn-login{width:100%;padding:12px;background:var(--g2);color:#fff;font-family:var(--head);font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;border:none;border-radius:4px;cursor:pointer;transition:background .15s}
.login-box .btn-login:hover{background:var(--g1);color:var(--bg)}
.login-err{color:var(--red);font-size:.82rem;margin-top:12px;min-height:20px}

/* CARDS */
.cards{display:grid;gap:14px}
.card{background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--g4);border-radius:0 6px 6px 0;padding:20px 24px;cursor:pointer;transition:border-left-color .2s,background .15s;text-decoration:none;color:inherit}
.card:hover{border-left-color:var(--g1);background:var(--bg3)}
.card-top{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 14px;margin-bottom:8px}
.card-num{font-family:var(--mono);font-size:1.1rem;color:var(--g1);font-weight:700}
.card-title{font-family:var(--head);font-size:1.05rem;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:.04em}
.card-pills{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;color:var(--g1);background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.2);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pill.amber{color:var(--amber);background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.2)}
.pill.red{color:var(--red);background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.2)}
.card-desc{font-size:.9rem;color:var(--text);line-height:1.7}
.card-meta{margin-top:8px;font-family:var(--mono);font-size:.62rem;color:var(--muted);letter-spacing:.08em}

/* EVENT DETAIL */
.ev-hero{padding:32px 0 24px;border-bottom:1px solid var(--border);margin-bottom:28px}
.ev-hero h1{font-family:var(--head);font-size:clamp(1.6rem,4vw,2.4rem);color:var(--white);text-transform:uppercase;letter-spacing:.04em}
.ev-hero h1 em{font-style:normal;color:var(--g1)}
.ev-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ev-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:28px}
.ev-info-cell{background:var(--bg2);padding:14px 16px}
.ev-info-cell .lbl{font-family:var(--mono);font-size:.55rem;letter-spacing:.2em;color:var(--g1);text-transform:uppercase;margin-bottom:4px}
.ev-info-cell .val{font-size:.9rem;color:var(--white);font-weight:400}
.ev-section{margin-bottom:28px}
.ev-section-title{font-family:var(--head);font-size:.9rem;font-weight:700;color:var(--g1);text-transform:uppercase;letter-spacing:.12em;padding-bottom:8px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.ev-body{font-size:.94rem;line-height:1.8;color:var(--text)}
.ev-body h3{font-family:var(--head);font-size:.85rem;color:var(--g1);text-transform:uppercase;letter-spacing:.1em;margin:18px 0 8px}
.ev-body p{margin-bottom:10px}
.ev-body b,.ev-body strong{color:var(--g1);font-weight:500}
.ev-note{background:rgba(74,222,128,.04);border:1px solid rgba(74,222,128,.18);border-radius:4px;padding:12px 16px;margin:14px 0;font-size:.88rem;color:#86c997;line-height:1.7;white-space:pre-line}
.btn-back{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.72rem;color:var(--muted);background:none;border:1px solid var(--border);padding:6px 14px;border-radius:3px;cursor:pointer;margin-bottom:20px;transition:all .15s}
.btn-back:hover{color:var(--g1);border-color:rgba(74,222,128,.3)}
.ev-actions{display:flex;gap:8px;margin-top:20px}

/* BUTTONS */
.btn{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;padding:8px 18px;border-radius:4px;cursor:pointer;border:1px solid;transition:all .15s}
.btn-green{background:var(--g2);color:#fff;border-color:var(--g2)}
.btn-green:hover{background:var(--g1);color:var(--bg);border-color:var(--g1)}
.btn-outline{background:none;color:var(--muted);border-color:var(--border)}
.btn-outline:hover{color:var(--g1);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.04)}
.btn-red{background:none;color:var(--red);border-color:rgba(239,68,68,.3)}
.btn-red:hover{background:rgba(239,68,68,.1);border-color:var(--red)}

/* FORM */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;color:var(--g1);text-transform:uppercase;margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--white);font-family:var(--sans);font-size:.9rem;padding:10px 14px;border-radius:4px;outline:none;transition:border-color .15s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--g2)}
.form-group textarea{min-height:120px;resize:vertical;line-height:1.6}
.form-group select{cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* USERS TABLE */
.users-table{width:100%;border-collapse:collapse;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.users-table th{font-family:var(--mono);font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--g1);background:rgba(74,222,128,.05);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border)}
.users-table td{font-size:.88rem;color:var(--text);padding:10px 14px;border-bottom:1px solid rgba(26,58,30,.5);background:var(--bg2);vertical-align:middle}
.users-table tr:last-child td{border-bottom:none}
.users-table tr:hover td{background:var(--bg3)}
.role-badge{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;padding:3px 8px;border-radius:3px;display:inline-block}
.role-admin{color:var(--amber);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2)}
.role-eventologist{color:var(--g1);background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.2)}
.role-junior{color:var(--muted);background:rgba(90,133,106,.1);border:1px solid rgba(90,133,106,.2)}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--g2);border-radius:6px;padding:12px 20px;font-family:var(--mono);font-size:.78rem;color:var(--g1);z-index:9999;transform:translateY(100px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{border-color:var(--red);color:var(--red)}

.page-title{font-family:var(--head);font-size:1.3rem;color:var(--white);text-transform:uppercase;letter-spacing:.06em;margin-bottom:24px;display:flex;align-items:center;gap:12px}
.page-title .count{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.08em}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .big{font-size:2.5rem;margin-bottom:12px}
.empty-state p{font-size:.9rem}

footer{position:relative;z-index:1;text-align:center;padding:20px;font-family:var(--mono);font-size:.6rem;color:var(--muted);letter-spacing:.1em;border-top:1px solid var(--border);margin-top:60px}

@media(max-width:580px){
  .topbar{padding:0 14px;gap:8px}
  main{padding:24px 14px 60px}
  .form-row{grid-template-columns:1fr}
  .card-pills{margin-left:0}
  .ev-info{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar" id="topbar" style="display:none">
  <span class="topbar-brand">Event Hub</span>
  <div class="topbar-nav">
    <button onclick="showPage('events')" id="nav-events">Ивенты</button>
    <button onclick="showPage('create')" id="nav-create">Создать</button>
    <button onclick="showPage('users')" id="nav-users" style="display:none">Пользователи</button>
  </div>
  <div class="topbar-right">
    <span class="topbar-user" id="topbar-user"></span>
    <button class="btn-logout" onclick="logout()">Выход</button>
  </div>
</div>

<main id="app"></main>

<div class="toast" id="toast"></div>

<script>
// STATE
let currentUser = null;
let allEvents = [];

const ROLE_LABELS = {
  admin: 'Главный Ивентолог',
  eventologist: 'Ивентолог',
  junior_eventologist: 'Мл. Ивентолог'
};

// INIT
async function init() {
  const res = await fetch('/api/me');
  const data = await res.json();
  if (data.authenticated) {
    currentUser = data;
    onLogin();
  } else {
    showLogin();
  }
}

function onLogin() {
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('topbar-user').innerHTML = `<b>${currentUser.display_name}</b> · ${ROLE_LABELS[currentUser.role]}`;
  if (currentUser.role === 'admin') {
    document.getElementById('nav-users').style.display = '';
  }
  showPage('events');
}

function showLogin() {
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <h2>Event Hub</h2>
        <p class="sub">Панель управления ивентами</p>
        <input type="text" id="login-user" placeholder="Логин" autocomplete="username">
        <input type="password" id="login-pass" placeholder="Пароль" autocomplete="current-password">
        <button class="btn-login" onclick="doLogin()">Войти</button>
        <div class="login-err" id="login-err"></div>
      </div>
    </div>`;
  document.getElementById('login-user').focus();
  document.getElementById('login-pass').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
}

async function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  if (!u || !p) return;
  const fd = new FormData();
  fd.append('username', u);
  fd.append('password', p);
  const res = await fetch('/api/login', {method:'POST', body:fd});
  const data = await res.json();
  if (data.error) {
    document.getElementById('login-err').textContent = data.error;
    return;
  }
  currentUser = (await (await fetch('/api/me')).json());
  onLogin();
}

async function logout() {
  await fetch('/api/logout', {method:'POST'});
  currentUser = null;
  showLogin();
}

// PAGES
function showPage(page) {
  document.querySelectorAll('.topbar-nav button').forEach(b => b.classList.remove('active'));
  const navBtn = document.getElementById('nav-' + page);
  if (navBtn) navBtn.classList.add('active');
  
  if (page === 'events') loadEvents();
  else if (page === 'create') showEventForm();
  else if (page === 'users') loadUsers();
}

// EVENTS LIST
async function loadEvents() {
  const res = await fetch('/api/events');
  allEvents = await res.json();
  renderEvents();
}

function renderEvents() {
  if (allEvents.length === 0) {
    document.getElementById('app').innerHTML = `
      <div class="page-title">Все ивенты</div>
      <div class="empty-state">
        <div class="big">📭</div>
        <p>Ивенты пока не созданы. Нажмите «Создать», чтобы добавить первый.</p>
      </div>`;
    return;
  }
  let html = `<div class="page-title">Все ивенты <span class="count">(${allEvents.length})</span></div>
    <div class="cards">`;
  allEvents.forEach((ev, i) => {
    html += `
      <div class="card" onclick="viewEvent(${ev.id})">
        <div class="card-top">
          <span class="card-num">#${ev.id}</span>
          <span class="card-title">${esc(ev.title)}</span>
          <div class="card-pills">
            <span class="pill">${esc(ev.event_type)}</span>
            <span class="pill">${esc(ev.duration)}</span>
          </div>
        </div>
        <div class="card-desc">${esc(ev.short_desc)}</div>
        <div class="card-meta">📍 ${esc(ev.location)} · 👤 ${esc(ev.organizer_name)} · Автор: ${esc(ev.author_name)}</div>
      </div>`;
  });
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

// EVENT DETAIL
async function viewEvent(id) {
  const res = await fetch('/api/events/' + id);
  const ev = await res.json();
  
  const canEdit = currentUser && (currentUser.role === 'admin' || currentUser.id === ev.author_id);
  
  let html = `
    <button class="btn-back" onclick="showPage('events')">← Назад к списку</button>
    <div class="ev-hero">
      <h1>${esc(ev.title)}</h1>
      <div class="ev-pills">
        <span class="pill">${esc(ev.event_type)}</span>
        <span class="pill">${esc(ev.duration)}</span>
        <span class="pill">#${ev.id}</span>
      </div>
    </div>
    <div class="ev-info">
      <div class="ev-info-cell"><div class="lbl">Локация</div><div class="val">${esc(ev.location)}</div></div>
      <div class="ev-info-cell"><div class="lbl">Организатор</div><div class="val">${esc(ev.organizer_name)}</div></div>
      <div class="ev-info-cell"><div class="lbl">Автор</div><div class="val">${esc(ev.author_name)}</div></div>
    </div>
    <div class="ev-section">
      <div class="ev-section-title">📡 Краткое описание</div>
      <div class="ev-body"><p>${esc(ev.short_desc)}</p></div>
    </div>
    <div class="ev-section">
      <div class="ev-section-title">📋 Полное описание</div>
      <div class="ev-body">${ev.full_desc}</div>
    </div>`;
  
  if (ev.rules_text) {
    html += `
    <div class="ev-section">
      <div class="ev-section-title">⚠ Правила</div>
      <div class="ev-note">${esc(ev.rules_text)}</div>
    </div>`;
  }
  if (ev.rewards_text) {
    html += `
    <div class="ev-section">
      <div class="ev-section-title">🏆 Награды</div>
      <div class="ev-note">${esc(ev.rewards_text)}</div>
    </div>`;
  }
  
  if (canEdit) {
    html += `
    <div class="ev-actions">
      <button class="btn btn-outline" onclick="editEvent(${ev.id})">✏ Редактировать</button>
      <button class="btn btn-red" onclick="deleteEvent(${ev.id})">🗑 Удалить</button>
    </div>`;
  }
  
  document.getElementById('app').innerHTML = html;
}

// CREATE / EDIT FORM
function showEventForm(ev) {
  const isEdit = !!ev;
  document.getElementById('app').innerHTML = `
    <button class="btn-back" onclick="showPage('events')">← Назад</button>
    <div class="page-title">${isEdit ? 'Редактирование' : 'Создание нового ивента'}</div>
    <form id="event-form" onsubmit="saveEvent(event, ${isEdit ? ev.id : 0})">
      <div class="form-row">
        <div class="form-group">
          <label>Название ивента</label>
          <input type="text" name="title" value="${isEdit ? esc(ev.title) : ''}" required>
        </div>
        <div class="form-group">
          <label>Тип ивента</label>
          <input type="text" name="event_type" value="${isEdit ? esc(ev.event_type) : ''}" placeholder="Сюжетный / Поисковый" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Продолжительность</label>
          <input type="text" name="duration" value="${isEdit ? esc(ev.duration) : ''}" placeholder="2–3 часа" required>
        </div>
        <div class="form-group">
          <label>Локация</label>
          <input type="text" name="location" value="${isEdit ? esc(ev.location) : ''}" placeholder="Дикая территория" required>
        </div>
      </div>
      <div class="form-group">
        <label>Организатор</label>
        <input type="text" name="organizer_name" value="${isEdit ? esc(ev.organizer_name) : (currentUser ? currentUser.display_name : '')}" required>
      </div>
      <div class="form-group">
        <label>Краткое описание</label>
        <textarea name="short_desc" rows="3" required>${isEdit ? esc(ev.short_desc) : ''}</textarea>
      </div>
      <div class="form-group">
        <label>Полное описание (поддерживается HTML)</label>
        <textarea name="full_desc" rows="10" required>${isEdit ? escTextarea(ev.full_desc) : ''}</textarea>
      </div>
      <div class="form-group">
        <label>Правила</label>
        <textarea name="rules_text" rows="3">${isEdit ? esc(ev.rules_text || '') : ''}</textarea>
      </div>
      <div class="form-group">
        <label>Награды</label>
        <textarea name="rewards_text" rows="3">${isEdit ? esc(ev.rewards_text || '') : ''}</textarea>
      </div>
      <div style="display:flex;gap:8px">
        <button type="submit" class="btn btn-green">${isEdit ? '💾 Сохранить' : '➕ Создать ивент'}</button>
        <button type="button" class="btn btn-outline" onclick="showPage('events')">Отмена</button>
      </div>
    </form>`;
}

async function editEvent(id) {
  const res = await fetch('/api/events/' + id);
  const ev = await res.json();
  showEventForm(ev);
  document.querySelectorAll('.topbar-nav button').forEach(b => b.classList.remove('active'));
}

async function saveEvent(e, editId) {
  e.preventDefault();
  const form = document.getElementById('event-form');
  const fd = new FormData(form);
  
  let url = '/api/events';
  let method = 'POST';
  if (editId) {
    url = '/api/events/' + editId;
    method = 'PUT';
  }
  
  const res = await fetch(url, {method, body: fd});
  const data = await res.json();
  
  if (data.success) {
    toast(editId ? 'Ивент обновлён!' : 'Ивент создан!');
    showPage('events');
  } else {
    toast(data.detail || 'Ошибка', true);
  }
}

async function deleteEvent(id) {
  if (!confirm('Удалить этот ивент? Это действие необратимо.')) return;
  const res = await fetch('/api/events/' + id, {method: 'DELETE'});
  const data = await res.json();
  if (data.success) {
    toast('Ивент удалён');
    showPage('events');
  } else {
    toast(data.detail || 'Ошибка', true);
  }
}

// USERS (Admin only)
async function loadUsers() {
  const res = await fetch('/api/users');
  if (res.status === 403) {
    toast('Нет прав доступа', true);
    showPage('events');
    return;
  }
  const users = await res.json();
  
  let html = `
    <div class="page-title">Управление пользователями <span class="count">(${users.length})</span></div>
    <div style="margin-bottom:20px">
      <button class="btn btn-green" onclick="showAddUser()">➕ Добавить пользователя</button>
    </div>
    <div id="add-user-form-wrap"></div>
    <table class="users-table">
      <thead><tr><th>ID</th><th>Логин</th><th>Имя</th><th>Роль</th><th></th></tr></thead>
      <tbody>`;
  users.forEach(u => {
    const rc = u.role === 'admin' ? 'role-admin' : u.role === 'eventologist' ? 'role-eventologist' : 'role-junior';
    html += `<tr>
      <td>${u.id}</td>
      <td style="font-family:var(--mono);font-size:.8rem">${esc(u.username)}</td>
      <td>${esc(u.display_name)}</td>
      <td><span class="role-badge ${rc}">${ROLE_LABELS[u.role]}</span></td>
      <td>${u.id !== currentUser.id ? `<button class="btn btn-red" onclick="deleteUser(${u.id})" style="font-size:.6rem;padding:4px 10px">Удалить</button>` : ''}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('app').innerHTML = html;
}

function showAddUser() {
  document.getElementById('add-user-form-wrap').innerHTML = `
    <form onsubmit="addUser(event)" style="background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:20px 24px;margin-bottom:20px">
      <div class="form-row">
        <div class="form-group"><label>Логин</label><input type="text" name="username" required></div>
        <div class="form-group"><label>Пароль</label><input type="password" name="password" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Отображаемое имя</label><input type="text" name="display_name" required></div>
        <div class="form-group">
          <label>Роль</label>
          <select name="role">
            <option value="junior_eventologist">Мл. Ивентолог</option>
            <option value="eventologist">Ивентолог</option>
            <option value="admin">Главный Ивентолог</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button type="submit" class="btn btn-green">Добавить</button>
        <button type="button" class="btn btn-outline" onclick="document.getElementById('add-user-form-wrap').innerHTML=''">Отмена</button>
      </div>
    </form>`;
}

async function addUser(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const res = await fetch('/api/users', {method: 'POST', body: fd});
  const data = await res.json();
  if (data.success) {
    toast('Пользователь добавлен!');
    loadUsers();
  } else {
    toast(data.detail || 'Ошибка', true);
  }
}

async function deleteUser(id) {
  if (!confirm('Удалить этого пользователя?')) return;
  const res = await fetch('/api/users/' + id, {method: 'DELETE'});
  const data = await res.json();
  if (data.success) {
    toast('Пользователь удалён');
    loadUsers();
  } else {
    toast(data.detail || 'Ошибка', true);
  }
}

// UTILS
function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escTextarea(s) {
  if (s == null) return '';
  return s.replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

init();
</script>

<footer>Event Hub · Панель управления ивентами</footer>

</body>
</html>
