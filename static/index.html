<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Event Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@500;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g1:#4ade80;--g2:#16a34a;--g3:#052e16;--g4:#14532d;--bg:#050f07;--bg2:#0a160b;--bg3:#0f1e10;--border:#1a3a1e;--text:#c6dfc9;--muted:#5a856a;--white:#eef5ee;--red:#ef4444;--amber:#f59e0b;--purple:#a78bfa;--mono:'Share Tech Mono',monospace;--sans:'Barlow',sans-serif;--head:'Oswald',sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(74,222,128,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(74,222,128,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.topbar{position:sticky;top:0;z-index:100;background:rgba(5,15,7,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;height:52px;gap:12px}
.topbar-brand{font-family:var(--head);font-size:1rem;font-weight:700;color:var(--g1);letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}
.topbar-nav{display:flex;gap:3px;margin-left:20px;flex-wrap:wrap}
.topbar-nav button{background:none;border:1px solid transparent;color:var(--muted);font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;padding:6px 12px;border-radius:3px;cursor:pointer;transition:all .15s;white-space:nowrap}
.topbar-nav button:hover,.topbar-nav button.active{color:var(--g1);border-color:rgba(74,222,128,.25);background:rgba(74,222,128,.06)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar-user{font-family:var(--mono);font-size:.65rem;color:var(--muted)}.topbar-user b{color:var(--g1)}
.btn-logout{background:none;border:1px solid rgba(239,68,68,.3);color:var(--red);font-family:var(--mono);font-size:.62rem;padding:5px 10px;border-radius:3px;cursor:pointer}
.bell{position:relative;background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px}
.bell-count{position:absolute;top:-4px;right:-6px;background:var(--red);color:#fff;font-family:var(--mono);font-size:.5rem;padding:1px 4px;border-radius:6px;display:none}
main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:32px 28px 80px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:44px 40px;width:100%;max-width:380px;text-align:center}
.login-box h2{font-family:var(--head);font-size:1.4rem;color:var(--white);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.login-box .sub{font-family:var(--mono);font-size:.62rem;color:var(--muted);letter-spacing:.12em;margin-bottom:28px}
.login-box input{display:block;width:100%;background:var(--bg);border:1px solid var(--border);color:var(--white);font-family:var(--sans);font-size:.9rem;padding:11px 14px;border-radius:4px;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:var(--g2)}
.login-box .btn-login{width:100%;padding:12px;background:var(--g2);color:#fff;font-family:var(--head);font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;border:none;border-radius:4px;cursor:pointer}
.login-box .btn-login:hover{background:var(--g1);color:var(--bg)}
.login-err{color:var(--red);font-size:.82rem;margin-top:12px;min-height:20px}
/* Cards */
.cards{display:grid;gap:12px}
.card{background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--g4);border-radius:0 6px 6px 0;padding:18px 22px;cursor:pointer;transition:all .2s}
.card:hover{background:var(--bg3)}
.card.approved{border-left-color:#16a34a;background:rgba(22,163,74,.04)}
.card.rejected{border-left-color:#dc2626;background:rgba(220,38,38,.04)}
.card.pending{border-left-color:#a16207}
.card-top{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-bottom:6px}
.card-num{font-family:var(--mono);font-size:1rem;color:var(--g1);font-weight:700}
.card-title{font-family:var(--head);font-size:1rem;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:.04em}
.card-pills{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;align-items:center}
.pill{font-family:var(--mono);font-size:.55rem;letter-spacing:.07em;color:var(--g1);background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.2);border-radius:99px;padding:2px 9px;white-space:nowrap}
.sb{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:.62rem;padding:3px 10px;border-radius:3px;font-weight:700}
.sb.approved{color:#22c55e;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3)}
.sb.rejected{color:#ef4444;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)}
.sb.pending{color:#eab308;background:rgba(234,179,8,.08);border:1px solid rgba(234,179,8,.2)}
.card-desc{font-size:.88rem;color:var(--text);line-height:1.65;margin-bottom:4px}
.card-meta{font-family:var(--mono);font-size:.58rem;color:var(--muted)}
/* Event detail */
.ev-hero{padding:28px 0 20px;border-bottom:1px solid var(--border);margin-bottom:24px}
.ev-hero h1{font-family:var(--head);font-size:clamp(1.5rem,4vw,2.2rem);color:var(--white);text-transform:uppercase;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ev-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ev-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:24px}
.ev-info-cell{background:var(--bg2);padding:12px 14px}
.ev-info-cell .lbl{font-family:var(--mono);font-size:.52rem;letter-spacing:.2em;color:var(--g1);text-transform:uppercase;margin-bottom:3px}
.ev-info-cell .val{font-size:.88rem;color:var(--white)}
.ev-section{margin-bottom:24px}
.ev-section-title{font-family:var(--head);font-size:.85rem;font-weight:700;color:var(--g1);text-transform:uppercase;letter-spacing:.12em;padding-bottom:7px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.ev-body{font-size:.92rem;line-height:1.75}.ev-body p{margin-bottom:8px}
.ev-note{background:rgba(74,222,128,.04);border:1px solid rgba(74,222,128,.18);border-radius:4px;padding:11px 15px;font-size:.85rem;color:#86c997;line-height:1.65;white-space:pre-line}
.btn-back{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.68rem;color:var(--muted);background:none;border:1px solid var(--border);padding:5px 12px;border-radius:3px;cursor:pointer;margin-bottom:16px}
.btn-back:hover{color:var(--g1);border-color:rgba(74,222,128,.3)}
.ev-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
/* Buttons */
.btn{font-family:var(--mono);font-size:.68rem;letter-spacing:.07em;padding:8px 16px;border-radius:4px;cursor:pointer;border:1px solid;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-green{background:var(--g2);color:#fff;border-color:var(--g2)}.btn-green:hover{background:var(--g1);color:var(--bg)}
.btn-outline{background:none;color:var(--muted);border-color:var(--border)}.btn-outline:hover{color:var(--g1);border-color:rgba(74,222,128,.3)}
.btn-red{background:none;color:var(--red);border-color:rgba(239,68,68,.3)}.btn-red:hover{background:rgba(239,68,68,.1)}
.btn-approve{background:rgba(34,197,94,.15);color:#22c55e;border-color:rgba(34,197,94,.4)}.btn-approve:hover{background:rgba(34,197,94,.25)}
.btn-reject{background:rgba(239,68,68,.1);color:#ef4444;border-color:rgba(239,68,68,.3)}.btn-reject:hover{background:rgba(239,68,68,.18)}
/* Forms */
.fg{margin-bottom:14px}.fg label{display:block;font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;color:var(--g1);text-transform:uppercase;margin-bottom:5px}
.fg input,.fg textarea,.fg select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--white);font-family:var(--sans);font-size:.88rem;padding:10px 12px;border-radius:4px;outline:none}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--g2)}
.fg textarea{min-height:110px;resize:vertical;line-height:1.6}.fg select{cursor:pointer}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* User cards */
.ucard{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px 18px;margin-bottom:10px}
.rbadge{font-family:var(--mono);font-size:.54rem;padding:3px 8px;border-radius:3px;display:inline-block;border:1px solid}
.tsel{background:var(--bg);border:1px solid var(--border);color:var(--white);font-family:var(--mono);font-size:.62rem;padding:4px 6px;border-radius:3px;cursor:pointer;outline:none}
.tbtn{font-family:var(--mono);font-size:.58rem;padding:3px 8px;border-radius:3px;cursor:pointer;border:1px solid;transition:all .15s;background:none}
/* Comments */
.comment{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:8px}
.comment-head{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.comment-name{font-size:.85rem;color:var(--white);font-weight:500}
.comment-role{font-family:var(--mono);font-size:.52rem;color:var(--muted)}
.comment-time{font-family:var(--mono);font-size:.52rem;color:var(--muted);margin-left:auto}
.comment-text{font-size:.85rem;line-height:1.6}
/* Spawn */
.spawn-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:10px 14px;margin-bottom:6px}
.sr-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:10px 14px;margin-bottom:6px;flex-wrap:wrap}
/* Roles */
.role-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:14px 18px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rc-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.rc-perm{font-family:var(--mono);font-size:.52rem;padding:2px 6px;border-radius:2px}
.rc-perm.on{color:var(--g1);background:rgba(74,222,128,.08)}.rc-perm.off{color:#555;background:rgba(255,255,255,.02)}
/* Notifications */
.notif-dd{position:absolute;top:52px;right:20px;width:340px;max-height:400px;overflow-y:auto;background:var(--bg2);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:200;display:none}
.notif-dd.open{display:block}
.notif-item{padding:10px 14px;border-bottom:1px solid var(--border);font-size:.78rem;cursor:pointer}
.notif-item:hover{background:var(--bg3)}
.notif-item.unread{border-left:3px solid var(--g1)}
.notif-time{font-family:var(--mono);font-size:.5rem;color:var(--muted);margin-top:3px}
/* Misc */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--g2);border-radius:6px;padding:12px 20px;font-family:var(--mono);font-size:.76rem;color:var(--g1);z-index:9999;transform:translateY(100px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}.toast.error{border-color:var(--red);color:var(--red)}
.page-title{font-family:var(--head);font-size:1.2rem;color:var(--white);text-transform:uppercase;letter-spacing:.06em;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.page-title .cnt{font-family:var(--mono);font-size:.65rem;color:var(--muted)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}.empty .big{font-size:2.5rem;margin-bottom:10px}
footer{position:relative;z-index:1;text-align:center;padding:18px;font-family:var(--mono);font-size:.58rem;color:var(--muted);border-top:1px solid var(--border);margin-top:50px}
@media(max-width:580px){.topbar{padding:8px 12px;height:auto;flex-wrap:wrap} main{padding:20px 12px 60px} .fr{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar" id="topbar" style="display:none">
  <span class="topbar-brand">Event Hub</span>
  <div class="topbar-nav">
    <button onclick="SP('events')" id="nav-events">Все ивенты</button>
    <button onclick="SP('my')" id="nav-my">Мои ивенты</button>
    <button onclick="SP('create')" id="nav-create">Создать</button>
    <button onclick="SP('spawn')" id="nav-spawn">Спавн-лист</button>
    <button onclick="SP('users')" id="nav-users" style="display:none">Юзеры</button>
    <button onclick="SP('roles')" id="nav-roles" style="display:none">Роли</button>
  </div>
  <div class="topbar-right">
    <button class="bell" id="bell-btn" onclick="toggleNotif()">🔔<span class="bell-count" id="bell-count">0</span></button>
    <span class="topbar-user" id="topbar-user"></span>
    <button class="btn-logout" onclick="logout()">Выход</button>
  </div>
</div>
<div class="notif-dd" id="notif-dd"></div>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
let U=null,ROLES=[];
const $=id=>document.getElementById(id);
const SL={approved:{i:'✅',t:'Одобрен',c:'approved'},rejected:{i:'❌',t:'Отклонён',c:'rejected'},pending:{i:'⏳',t:'На проверке',c:'pending'}};
function esc(s){if(s==null)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function escTA(s){return(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toast(m,e){const t=$('toast');t.textContent=m;t.className='toast show'+(e?' error':'');setTimeout(()=>t.className='toast',3000)}
function stb(s){const o=SL[s]||SL.pending;return'<span class="sb '+o.c+'">'+o.i+' '+o.t+'</span>'}
function roleBadge(rk){const r=ROLES.find(function(x){return x.role_key===rk});if(!r)return'<span class="rbadge" style="color:var(--muted);border-color:var(--border)">'+esc(rk)+'</span>';return'<span class="rbadge" style="color:'+r.color+';border-color:'+r.color+'40;background:'+r.color+'15">'+esc(r.display_name)+'</span>'}

async function init(){
  try{ROLES=await(await fetch('/api/roles')).json()}catch(e){ROLES=[]}
  var d=await(await fetch('/api/me')).json();
  if(d.authenticated){U=d;onLogin()}else{showLogin()}
}
function onLogin(){
  $('topbar').style.display='flex';
  $('topbar-user').innerHTML='<b>'+U.display_name+'</b> · '+U.role_display;
  $('nav-users').style.display=U.can_manage_users?'':'none';
  $('nav-roles').style.display=U.can_manage_roles?'':'none';
  pollNotif();
  SP('events');
}
function showLogin(){
  $('topbar').style.display='none';
  $('app').innerHTML='<div class="login-wrap"><div class="login-box"><h2>Event Hub</h2><p class="sub">Панель управления ивентами</p><input type="text" id="l-u" placeholder="Логин" autocomplete="username"><input type="password" id="l-p" placeholder="Пароль" autocomplete="current-password"><button class="btn-login" onclick="doLogin()">Войти</button><div class="login-err" id="l-e"></div></div></div>';
  $('l-u').focus();
  $('l-p').onkeypress=function(e){if(e.key==='Enter')doLogin()};
}
async function doLogin(){
  var u=$('l-u').value.trim(),p=$('l-p').value;if(!u||!p)return;
  var fd=new FormData();fd.append('username',u);fd.append('password',p);
  var d=await(await fetch('/api/login',{method:'POST',body:fd})).json();
  if(d.error){$('l-e').textContent=d.error;return}
  try{ROLES=await(await fetch('/api/roles')).json()}catch(e){ROLES=[]}
  U=await(await fetch('/api/me')).json();onLogin();
}
async function logout(){await fetch('/api/logout',{method:'POST'});U=null;showLogin()}

function SP(p){
  document.querySelectorAll('.topbar-nav button').forEach(function(b){b.classList.remove('active')});
  var n=$('nav-'+p);if(n)n.classList.add('active');
  $('notif-dd').classList.remove('open');
  if(p==='events')loadEvents();
  else if(p==='my')loadMyEvents();
  else if(p==='create')showEventForm(null);
  else if(p==='spawn')loadSpawnList();
  else if(p==='users')loadUsers();
  else if(p==='roles')loadRoles();
}

// ═══ NOTIFICATIONS ═══
async function pollNotif(){
  try{
    var d=await(await fetch('/api/notifications/count')).json();
    var bc=$('bell-count');
    if(d.count>0){bc.textContent=d.count;bc.style.display='block'}
    else{bc.style.display='none'}
  }catch(e){}
  setTimeout(pollNotif,15000);
}
async function toggleNotif(){
  var dd=$('notif-dd');
  if(dd.classList.contains('open')){dd.classList.remove('open');return}
  var d=await(await fetch('/api/notifications')).json();
  var h='<div style="padding:8px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)"><span style="font-family:var(--mono);font-size:.62rem;color:var(--g1)">🔔 Уведомления</span><button class="tbtn" style="color:var(--g1);border-color:rgba(74,222,128,.3)" onclick="readAllNotif()">✓ Все</button></div>';
  if(!d.notifications.length){h+='<div style="padding:20px;text-align:center;color:var(--muted);font-size:.8rem">Нет уведомлений</div>'}
  else{d.notifications.forEach(function(n){
    h+='<div class="notif-item '+(n.is_read?'':'unread')+'" '+(n.event_id?'onclick="$(\'notif-dd\').classList.remove(\'open\');viewEvent('+n.event_id+')"':'')+'>'+esc(n.message)+'<div class="notif-time">'+n.created_at+'</div></div>';
  })}
  dd.innerHTML=h;dd.classList.add('open');
}
async function readAllNotif(){
  await fetch('/api/notifications/read-all',{method:'POST'});
  $('bell-count').style.display='none';$('notif-dd').classList.remove('open');toast('Прочитано');
}
document.addEventListener('click',function(e){if(!e.target.closest('.bell')&&!e.target.closest('.notif-dd'))$('notif-dd').classList.remove('open')});

// ═══ EVENTS ═══
function renderCards(evs,title,emptyMsg){
  var a=$('app');
  if(!evs.length){a.innerHTML='<div class="page-title">'+title+'</div><div class="empty"><div class="big">📭</div><p>'+emptyMsg+'</p></div>';return}
  var h='<div class="page-title">'+title+' <span class="cnt">('+evs.length+')</span></div><div class="cards">';
  for(var i=0;i<evs.length;i++){
    var ev=evs[i];var st=ev.status||'pending';var num=evs.length-i;
    h+='<div class="card '+st+'" data-id="'+ev.id+'">';
    h+='<div class="card-top"><span class="card-num">№'+num+'</span><span class="card-title">'+esc(ev.title)+'</span>';
    h+='<div class="card-pills">'+stb(st)+'<span class="pill">'+esc(ev.event_type)+'</span><span class="pill">'+esc(ev.duration)+'</span></div></div>';
    h+='<div class="card-desc">'+esc(ev.short_desc)+'</div>';
    h+='<div class="card-meta">📍 '+esc(ev.location)+' · 👤 '+esc(ev.organizer_name)+' · '+esc(ev.author_name)+(ev.reviewed_by?' · ✓ '+esc(ev.reviewed_by):'')+'</div>';
    h+='</div>';
  }
  h+='</div>';
  a.innerHTML=h;
  // Attach click handlers after rendering
  var cards=a.querySelectorAll('.card');
  cards.forEach(function(card){
    card.addEventListener('click',function(){
      var id=parseInt(this.getAttribute('data-id'));
      viewEvent(id);
    });
  });
}

async function loadEvents(){
  var evs=await(await fetch('/api/events')).json();
  renderCards(evs,'Все ивенты','Ивенты пока не созданы.');
}
async function loadMyEvents(){
  var evs=await(await fetch('/api/events/my')).json();
  renderCards(evs,'Мои ивенты','У вас пока нет ивентов.');
}

async function viewEvent(id){
  var ev=await(await fetch('/api/events/'+id)).json();
  var st=ev.status||'pending';
  var isA=U&&U.id===ev.author_id;
  var isTop=U&&(U.role==='head_admin'||U.role==='admin');
  var canEdit=U&&(isTop||(st!=='approved'&&(U.can_edit_all||isA)));
  var canReview=U&&U.can_approve;

  var h='<button class="btn-back" onclick="SP(\'events\')">← Назад</button>';
  h+='<div class="ev-hero"><h1>'+esc(ev.title)+' '+stb(st)+'</h1>';
  h+='<div class="ev-pills"><span class="pill">'+esc(ev.event_type)+'</span><span class="pill">'+esc(ev.duration)+'</span></div></div>';
  h+='<div class="ev-info">';
  h+='<div class="ev-info-cell"><div class="lbl">Локация</div><div class="val">'+esc(ev.location)+'</div></div>';
  h+='<div class="ev-info-cell"><div class="lbl">Организатор</div><div class="val">'+esc(ev.organizer_name)+'</div></div>';

}
function showAddRole(){$('arf').innerHTML=roleForm(null)}
function showEditRole(id){var r=ROLES.find(function(x){return x.id===id});if(!r)return;var el=document.getElementById('erf-'+id);if(!el){el=document.createElement('div');el.id='erf-'+id;var cards=document.querySelectorAll('.role-card');cards.forEach(function(c){if(c.textContent.indexOf(r.display_name)!==-1)c.after(el)})}el.innerHTML=roleForm(r)}
function bRFD(f){var fd=new FormData();['role_key','display_name','color','priority'].forEach(function(k){fd.append(k,f[k].value)});['can_approve','can_edit_all','can_manage_users','can_manage_roles'].forEach(function(k){fd.append(k,f[k]&&f[k].checked?1:0)});return fd}
async function addRole(e){e.preventDefault();var d=await(await fetch('/api/roles',{method:'POST',body:bRFD(e.target)})).json();if(d.success){toast('Роль создана!');loadRoles()}else toast(d.detail||'Ошибка',1)}
async function updRole(e,id){e.preventDefault();var d=await(await fetch('/api/roles/'+id,{method:'PUT',body:bRFD(e.target)})).json();if(d.success){toast('Обновлена!');loadRoles()}else toast(d.detail||'Ошибка',1)}
async function delRole(id){if(!confirm('Удалить роль?'))return;var d=await(await fetch('/api/roles/'+id,{method:'DELETE'})).json();if(d.success){toast('Удалена');loadRoles()}else toast(d.detail||'Ошибка',1)}

init();
</script>
